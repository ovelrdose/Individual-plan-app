<div id="cell-panel" class="card shadow board-panel">
  <div class="card-body py-2">
    <div class="d-flex align-items-center gap-2">
      <span class="text-success"><i class="bi bi-check-circle"></i> {{ done }}</span>
      <button type="button" class="btn-close ms-auto" aria-label="Закрыть"
              onclick="const p = this.closest('#cell-panel'); p.replaceChildren(); p.className = ''"></button>
    </div>
    {% if skipped %}
      <div class="small mt-1">Не изменены:
        <ul class="mb-0 ps-3">{% for day, reason in skipped %}<li>{{ day|date:"d.m" }} — {{ reason }}</li>{% endfor %}</ul>
      </div>
    {% endif %}
  </div>
</div>
{% include "scheduling/_board.html" with oob=True %}
