{# Итог перестройки после изменения смены или распорядка (FR-SCH-13, решение 43). #}
{% if rebuild %}
  <div class="alert {% if rebuild.unplaced %}alert-warning{% else %}alert-info{% endif %} py-2 d-flex align-items-center gap-2">
    <i class="bi bi-arrow-left-right"></i>
    <span>
      Перестроено занятий: {{ rebuild.items|length }}{% if rebuild.unplaced %}, не удалось поставить: {{ rebuild.unplaced }}{% endif %}.
    </span>
    <a class="ms-auto" href="{% url 'scheduling:change' rebuild.pk %}">Сводка — кто к кому и «Вернуть как было»</a>
  </div>
{% endif %}
