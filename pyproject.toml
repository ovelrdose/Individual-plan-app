[project]
name = "omr4-app"
version = "0.1.0"
description = "Индивидуальная программа медицинской реабилитации: карты пациентов и расписание занятий"
requires-python = ">=3.12"

# Приложение не устанавливается как пакет: зависимости ставятся группами.
#   pip install --group dev
[dependency-groups]
main = [
    "Django==5.2.17",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.6",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "django-simple-history==3.13.0",
    "python-docx==1.2.0",
]
dev = [
    { include-group = "main" },
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "RUF"]
# RUF001-003: русский текст в строках и комментариях — норма для проекта.
# RUF012: списки в атрибутах классов — идиома Django (Meta, ModelAdmin, формы).
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
