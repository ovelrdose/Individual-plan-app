# nginx: HTTPS и статика перед gunicorn. Установка — docs/deploy.md, шаг 9.
#   sudo cp /opt/omr4/app/deploy/nginx-omr4.conf /etc/nginx/sites-available/omr4
#   sudo ln -s /etc/nginx/sites-available/omr4 /etc/nginx/sites-enabled/omr4
# Заменить omr4.clinic.local на имя сервера (то же, что в ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS).

# Журнал без строки запроса: в поиске бывают ФИО пациентов (TZ.md NFR-7).
log_format omr4 '$remote_addr - [$time_local] "$request_method $uri" $status '
                '$body_bytes_sent $request_time';

upstream omr4_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name omr4.clinic.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name omr4.clinic.local;

    ssl_certificate     /etc/ssl/omr4/omr4.crt;
    ssl_certificate_key /etc/ssl/omr4/omr4.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/omr4.access.log omr4;
    error_log  /var/log/nginx/omr4.error.log warn;

    # Лист назначений — до 5 МБ (TZ.md FR-IMP-12), с запасом.
    client_max_body_size 6m;

    location /static/ {
        alias /opt/omr4/app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Поток обновлений (SSE, NFR-11): без буфера и без обрыва по таймауту.
    location /events/ {
        proxy_pass http://omr4_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://omr4_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
